<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 Compte à rebours Anniversaire</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Confettis de fond -->
    <div class="confetti-container" id="confetti"></div>

    <!-- Contenu principal -->
    <div class="container">
        <!-- Titre festif -->
        <div class="header">
            <h1 class="title">
                <span class="letter">B</span>
                <span class="letter">o</span>
                <span class="letter">n</span>
                <span class="letter"> </span>
                <span class="letter">A</span>
                <span class="letter">n</span>
                <span class="letter">n</span>
                <span class="letter">i</span>
                <span class="letter">v</span>
                <span class="letter">e</span>
                <span class="letter">r</span>
                <span class="letter">s</span>
                <span class="letter">a</span>
                <span class="letter">i</span>
                <span class="letter">r</span>
                <span class="letter">e</span>
            </h1>
            <p class="subtitle">✨ 16 Juin 2026 ✨</p>
        </div>

        <!-- Décompte -->
        <div class="countdown-wrapper">
            <div class="countdown" id="countdown">
                <div class="countdown-item">
                    <div class="countdown-number" id="days">0</div>
                    <div class="countdown-label">Jours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="hours">0</div>
                    <div class="countdown-label">Heures</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="minutes">0</div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="seconds">0</div>
                    <div class="countdown-label">Secondes</div>
                </div>
            </div>
        </div>

        <!-- Message de célébration -->
        <div class="celebration-message" id="celebrationMessage" style="display: none;">
            <h2 class="celebrate-text">🎊 C'est l'anniversaire ! 🎊</h2>
            <p class="celebrate-subtitle">Joyeux Anniversaire ! 🎁✨</p>
        </div>

        <!-- Galerie de photos -->
        <div class="gallery-section">
            <h2 class="gallery-title">📸 Galerie Photos</h2>
            <div class="gallery">
                <div class="gallery-item">
                    <img src="images/photo1.jpeg" alt="Photo d'anniversaire 1">
                    <div class="gallery-overlay">Photo 1</div>
                </div>
                <div class="gallery-item">
                    <img src="images/photo2.jpeg" alt="Photo d'anniversaire 2">
                    <div class="gallery-overlay">Photo 2</div>
                </div>
                <div class="gallery-item">
                    <img src="images/photo3.jpeg" alt="Photo d'anniversaire 3">
                    <div class="gallery-overlay">Photo 3</div>
                </div>
                <div class="gallery-item">
                    <img src="images/photo4.jpeg" alt="Photo d'anniversaire 4">
                    <div class="gallery-overlay">Photo 4</div>
                </div>
                <div class="gallery-item">
                    <img src="images/photo5.jpeg" alt="Photo d'anniversaire 5">
                    <div class="gallery-overlay">Photo 5</div>
                </div>
                <div class="gallery-item">
                    <img src="images/photo6.jpeg" alt="Photo d'anniversaire 6">
                    <div class="gallery-overlay">Photo 6</div>
                </div>
                <div class="gallery-item">
                    <img src="images/photo7.jpeg" alt="Photo d'anniversaire 7">
                    <div class="gallery-overlay">Photo 7</div>
                </div>
                <div class="gallery-item">
                    <img src="images/photo8.jpg" alt="Photo d'anniversaire 8">
                    <div class="gallery-overlay">Photo 8</div>
                </div>
            </div>
        </div>

        <!-- Décoration festive -->
        <div class="balloons">
            <div class="balloon balloon-1">🎈</div>
            <div class="balloon balloon-2">🎈</div>
            <div class="balloon balloon-3">🎈</div>
            <div class="balloon balloon-4">🎈</div>
            <div class="balloon balloon-5">🎈</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
